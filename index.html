<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Конференція, де кожен може побути організатором">
    <title>Конференція — організатор кожні 10 хвилин</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #000000;
            color: #d0d0d0;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            font-size: 18px;
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            min-height: 100vh;
        }

        main {
            max-width: 720px;
            width: 100%;
            text-align: left;
        }

        h1 {
            color: #ffffff;
            font-size: 1.9rem;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 0.3px;
        }

        p {
            margin-bottom: 18px;
            color: #d0d0d0;
        }

        .highlight {
            color: #ffffff;
        }

        .note {
            color: #888888;
            font-size: 0.95rem;
            margin-top: 32px;
            border-left: 2px solid #444444;
            padding-left: 14px;
        }

        a {
            color: #ffffff;
            text-decoration: underline;
        }

        a:hover, a:focus {
            color: #aaaaaa;
            outline: 1px solid #666666;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Так, короче</h1>

        <p>
            На конференції <span class="highlight">кожний зможе побути організатором</span>.
            Організатор буде змінюваться кожні <span class="highlight">10 хвилин</span>.
        </p>

        <p>
            А далі я ще не придумав — свої ідеї кидайте мені в лічку,
            самі лучші попадуть в список.
        </p>

        <p class="note">
            Пишіть ідеї в особисті повідомлення. Найкращі пропозиції будуть додані до списку.
        </p>
    </main>
</body>
</html>
